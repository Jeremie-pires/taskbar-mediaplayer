name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.N for a pre-release) builds the installer and the portable zip and
# publishes them as a GitHub release. The tag must match project(... VERSION X.Y.Z) in CMakeLists.txt.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the annotated tag's message becomes the release notes

      - name: Check the tag against the project version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          PROJECT=$(sed -nE 's/^project\([^)]*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          if [ "$VERSION" != "$PROJECT" ]; then
            echo "::error::Tag $TAG does not match CMakeLists.txt version $PROJECT"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "${BASH_REMATCH[2]}" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; fi

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build installer and portable zip
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FLAGS=()
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
          # The annotated tag's message, else notes generated from the merged pull requests.
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          if [ -n "$NOTES" ]; then FLAGS+=(--notes "$NOTES"); else FLAGS+=(--generate-notes); fi
          gh release create "$TAG" --title "Taskbar Media Player $VERSION" "${FLAGS[@]}" \
            "dist/TaskbarMediaPlayer-Setup-$VERSION.exe" \
            "dist/TaskbarMediaPlayer-$VERSION-portable.zip" \
            dist/SHA256SUMS.txt
