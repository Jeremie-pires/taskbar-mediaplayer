name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (warnings as errors) and installer
    # windows-2025 ships Visual Studio, CMake and Inno Setup 6. No -G: CMake picks the newest Visual Studio installed.
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Build installer and portable zip
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taskbar-mediaplayer-${{ github.sha }}
          path: dist/
          retention-days: 14

  sonarqube:
    name: SonarQube Cloud analysis
    runs-on: windows-2025
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output
      # Empty on pull requests from forks, which get no secrets: the analysis is then skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history: better new-code detection and blame

      - name: Install Build Wrapper
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1

      - name: Build under Build Wrapper
        if: env.SONAR_TOKEN != ''
        run: |
          cmake -S . -B build -A x64
          build-wrapper-win-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} cmake --build build --config Release

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: >
            --define "sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json"
